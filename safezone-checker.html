<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ショート動画UI被り（セーフゾーン）チェッカー</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #59636e;
      --primary: #0969da;
      --primary-hover: #0550ae;
      --ok-bg: #dafbe1;
      --ok-text: #1a7f37;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .privacy-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--ok-bg);
      color: var(--ok-text);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      margin: 0 0 8px 0;
    }

    /* プラットフォーム切替ボタン */
    .platform-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .plat-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .plat-btn:hover { background: #f3f4f6; }

    .plat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* スライダー */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      cursor: pointer;
    }

    .slider-val {
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* 凡例 */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .swatch.danger { background: rgba(239, 68, 68, 0.75); border: 1px solid #dc2626; }
    .swatch.caution { background: rgba(245, 158, 11, 0.55); border: 1px solid #d97706; }
    .swatch.safe { background: transparent; border: 2px dashed #16a34a; }

    /* ドロップゾーン（サイドバー内） */
    .drop-box {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 16px 12px;
      text-align: center;
      background: #fafbfc;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .drop-box.dragover {
      border-color: var(--primary);
      background: #ddf4ff;
    }

    .drop-box strong { color: var(--text); display: block; margin-bottom: 4px; }

    .file-meta {
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }

    /* 右側：プレビューエリア */
    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .phone-stage {
      position: relative;
      height: min(76vh, 720px);
      aspect-ratio: 9 / 16;
      background: #111827;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      border: 3px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-stage.dragover {
      outline: 4px solid var(--primary);
      outline-offset: 4px;
    }

    .placeholder-msg {
      color: #9ca3af;
      text-align: center;
      padding: 24px;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .media-el {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    #overlaySvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transition: opacity 0.08s linear;
    }

    /* 動画コントロールバー（プレビュー外） */
    .video-controls {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .video-controls.show { display: flex; }

    .vc-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover { background: #f3f4f6; }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    #seekBar { flex: 1; cursor: pointer; }

    .time-label {
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 82px;
      text-align: right;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      cursor: pointer;
      user-select: none;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        padding: 12px;
      }
      .phone-stage {
        height: auto;
        width: min(88vw, 380px);
      }
    }
  </style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>ショート動画UI被り（セーフゾーン）チェッカー</h1>
    <span class="privacy-badge">完全ローカル処理・外部送信なし</span>
  </div>
</header>

<main>
  <!-- 左：操作パネル -->
  <section class="panel">
    <div>
      <p class="section-title">1. 動画（MP4）または画像（PNG/JPG）</p>
      <div class="drop-box" id="dropBox">
        <strong>ここにドラッグ＆ドロップ</strong>
        またはクリックして選択
        <input type="file" id="fileInput" accept="video/mp4,video/webm,video/quicktime,image/png,image/jpeg,image/webp" hidden />
      </div>
      <div class="file-meta" id="fileMeta" style="margin-top:6px;">未選択（プレビュー枠へのドロップも可）</div>
    </div>

    <div>
      <p class="section-title">2. プラットフォームUIガイド</p>
      <div class="platform-grid">
        <button type="button" class="plat-btn active" data-platform="youtube">YouTube Shorts</button>
        <button type="button" class="plat-btn" data-platform="tiktok">TikTok</button>
        <button type="button" class="plat-btn" data-platform="reels">Instagram Reels</button>
        <button type="button" class="plat-btn" data-platform="all">3媒体共通（厳格）</button>
      </div>
    </div>

    <div>
      <p class="section-title">3. ガイドの透明度</p>
      <div class="slider-row">
        <input type="range" id="opacitySlider" min="0" max="100" value="75" />
        <span class="slider-val" id="opacityVal">75%</span>
      </div>
      <label class="toggle-row" style="margin-top:8px;">
        <input type="checkbox" id="showSafeBorder" checked />
        セーフゾーン枠（緑の点線）を表示
      </label>
    </div>

    <div>
      <p class="section-title">色分けの目安（1080×1920基準）</p>
      <div class="legend">
        <div class="legend-item"><span class="swatch danger"></span><span><strong>危険（赤）：</strong>ボタン・タイトル等が直接被る</span></div>
        <div class="legend-item"><span class="swatch caution"></span><span><strong>注意（黄）：</strong>端末差・長文キャプションで被る</span></div>
        <div class="legend-item"><span class="swatch safe"></span><span><strong>安全（緑枠）：</strong>字幕・立ち絵の推奨エリア</span></div>
      </div>
    </div>
  </section>

  <!-- 右：9:16 プレビュー -->
  <section class="preview-container">
    <div class="phone-stage" id="phoneStage">
      <div class="placeholder-msg" id="placeholderMsg">
        縦長動画（MP4）または画像（PNG/JPG）を<br>ここにドロップしてください
      </div>
      <video id="videoPreview" class="media-el" playsinline loop></video>
      <img id="imagePreview" class="media-el" alt="プレビュー画像" />
      <svg id="overlaySvg" viewBox="0 0 1080 1920" preserveAspectRatio="none"></svg>
    </div>

    <!-- 動画用コントロールバー -->
    <div class="video-controls" id="videoControls">
      <div class="vc-row">
        <button type="button" class="btn btn-primary" id="playPauseBtn">再生</button>
        <button type="button" class="btn" id="back1sBtn">-1秒</button>
        <button type="button" class="btn" id="fwd1sBtn">+1秒</button>
        <button type="button" class="btn" id="muteBtn">ミュート</button>
      </div>
      <div class="vc-row">
        <input type="range" id="seekBar" min="0" max="100" step="0.01" value="0" />
        <span class="time-label" id="timeLabel">0:00 / 0:00</span>
      </div>
    </div>
  </section>
</main>

<script>
  // ==========================================
  // プラットフォーム別ガイド定義（1080 x 1920 基準）
  // ==========================================
  const GUIDES = {
    youtube: {
      name: 'YouTube Shorts',
      topDanger: 140,
      bottomDanger: 380,
      bottomCaution: 100, // タイトル2行・関連動画リンク等の余裕
      rightDanger: { x: 910, y: 820, w: 170, h: 720 }, // いいね・コメント・共有・リミックス
      safe: { x: 40, y: 150, w: 860, h: 1290 },
      icons: [
        { cx: 995, cy: 910, label: '高評価' },
        { cx: 995, cy: 1045, label: '低評価' },
        { cx: 995, cy: 1180, label: 'コメント' },
        { cx: 995, cy: 1315, label: '共有' },
        { cx: 995, cy: 1450, label: 'リミックス' }
      ],
      bottomMock: '@チャンネル名  [登録]\n動画タイトル・ハッシュタグがここに表示されます'
    },
    tiktok: {
      name: 'TikTok',
      topDanger: 150,
      bottomDanger: 420,
      bottomCaution: 100,
      rightDanger: { x: 910, y: 740, w: 170, h: 760 },
      safe: { x: 40, y: 160, w: 860, h: 1240 },
      icons: [
        { cx: 995, cy: 820, label: 'アイコン' },
        { cx: 995, cy: 960, label: 'いいね' },
        { cx: 995, cy: 1095, label: 'コメント' },
        { cx: 995, cy: 1230, label: '保存' },
        { cx: 995, cy: 1365, label: 'シェア' }
      ],
      bottomMock: '@username\nキャプション・ハッシュタグ・楽曲情報が表示されます'
    },
    reels: {
      name: 'Instagram Reels',
      topDanger: 160,
      bottomDanger: 440,
      bottomCaution: 90,
      rightDanger: { x: 910, y: 880, w: 170, h: 600 },
      safe: { x: 40, y: 170, w: 860, h: 1220 },
      icons: [
        { cx: 995, cy: 960, label: 'いいね' },
        { cx: 995, cy: 1095, label: 'コメント' },
        { cx: 995, cy: 1230, label: 'シェア' },
        { cx: 995, cy: 1365, label: 'メニュー' }
      ],
      bottomMock: 'account_name  [フォロー]\nリールのキャプションと音源名がここに表示されます'
    },
    all: {
      name: '3媒体共通（厳格）',
      topDanger: 160,
      bottomDanger: 440,
      bottomCaution: 100,
      rightDanger: { x: 910, y: 740, w: 170, h: 740 },
      safe: { x: 40, y: 170, w: 860, h: 1210 },
      icons: [
        { cx: 995, cy: 840, label: 'UI群' },
        { cx: 995, cy: 1010, label: 'UI群' },
        { cx: 995, cy: 1180, label: 'UI群' },
        { cx: 995, cy: 1350, label: 'UI群' }
      ],
      bottomMock: 'YouTube / TikTok / Reels 共通の最大被り領域'
    }
  };

  let currentPlatform = 'youtube';
  let currentObjectUrl = null;

  const els = {
    dropBox: document.getElementById('dropBox'),
    phoneStage: document.getElementById('phoneStage'),
    fileInput: document.getElementById('fileInput'),
    fileMeta: document.getElementById('fileMeta'),
    placeholderMsg: document.getElementById('placeholderMsg'),
    videoPreview: document.getElementById('videoPreview'),
    imagePreview: document.getElementById('imagePreview'),
    overlaySvg: document.getElementById('overlaySvg'),
    opacitySlider: document.getElementById('opacitySlider'),
    opacityVal: document.getElementById('opacityVal'),
    showSafeBorder: document.getElementById('showSafeBorder'),
    videoControls: document.getElementById('videoControls'),
    playPauseBtn: document.getElementById('playPauseBtn'),
    back1sBtn: document.getElementById('back1sBtn'),
    fwd1sBtn: document.getElementById('fwd1sBtn'),
    muteBtn: document.getElementById('muteBtn'),
    seekBar: document.getElementById('seekBar'),
    timeLabel: document.getElementById('timeLabel'),
  };

  function renderOverlay() {
    const g = GUIDES[currentPlatform];
    const showSafe = els.showSafeBorder.checked;
    const bottomY = 1920 - g.bottomDanger;
    const cautionY = bottomY - g.bottomCaution;
    const mockLines = g.bottomMock.split('\n');

    const iconsSvg = g.icons.map((ic) => `
      <circle cx="${ic.cx}" cy="${ic.cy}" r="38" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.85)" stroke-width="4" />
      <text x="${ic.cx}" y="${ic.cy + 62}" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">${ic.label}</text>
    `).join('');

    const safeSvg = showSafe ? `
      <rect x="${g.safe.x}" y="${g.safe.y}" width="${g.safe.w}" height="${g.safe.h}"
            fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="20 14" rx="12" />
      <rect x="${g.safe.x + 12}" y="${g.safe.y + 12}" width="290" height="44" rx="6" fill="rgba(22, 163, 74, 0.85)" />
      <text x="${g.safe.x + 26}" y="${g.safe.y + 42}" fill="#ffffff" font-size="26" font-weight="700">セーフゾーン（安全）</text>
    ` : '';

    els.overlaySvg.innerHTML = `
      <!-- 上部：危険ゾーン -->
      <rect x="0" y="0" width="1080" height="${g.topDanger}" fill="rgba(239, 68, 68, 0.45)" />
      <line x1="0" y1="${g.topDanger}" x2="1080" y2="${g.topDanger}" stroke="#ef4444" stroke-width="4" />
      <text x="540" y="${g.topDanger / 2 + 12}" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">
        上部UI危険ゾーン（${g.name}）
      </text>

      <!-- 右側：ボタン列危険ゾーン -->
      <rect x="${g.rightDanger.x}" y="${g.rightDanger.y}" width="${g.rightDanger.w}" height="${g.rightDanger.h}"
            fill="rgba(239, 68, 68, 0.45)" stroke="#ef4444" stroke-width="3" rx="12" />
      ${iconsSvg}

      <!-- 下部直上：注意ゾーン -->
      <rect x="0" y="${cautionY}" width="910" height="${g.bottomCaution}" fill="rgba(245, 158, 11, 0.35)" />
      <line x1="0" y1="${cautionY}" x2="910" y2="${cautionY}" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12 8" />
      <text x="28" y="${cautionY + 60}" fill="#fffbeb" font-size="26" font-weight="700">注意ゾーン（長文キャプション・端末差）</text>

      <!-- 下部：危険ゾーン -->
      <rect x="0" y="${bottomY}" width="1080" height="${g.bottomDanger}" fill="rgba(239, 68, 68, 0.5)" />
      <line x1="0" y1="${bottomY}" x2="1080" y2="${bottomY}" stroke="#ef4444" stroke-width="4" />
      <text x="40" y="${bottomY + 80}" fill="#ffffff" font-size="34" font-weight="700">${mockLines[0]}</text>
      <text x="40" y="${bottomY + 135}" fill="rgba(255,255,255,0.9)" font-size="28">${mockLines[1] || ''}</text>
      <text x="40" y="${bottomY + 230}" fill="#fecaca" font-size="30" font-weight="700">下部UI危険ゾーン（字幕・立ち絵NG）</text>

      ${safeSvg}
    `;
  }

  function updateOpacity() {
    const val = Number(els.opacitySlider.value);
    els.opacityVal.textContent = `${val}%`;
    els.overlaySvg.style.opacity = val / 100;
  }

  function formatSec(sec) {
    if (!Number.isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function loadMediaFile(file) {
    if (!file) return;
    const isVideo = file.type.startsWith('video/');
    const isImage = file.type.startsWith('image/');
    if (!isVideo && !isImage) {
      alert('MP4動画またはPNG/JPG画像を選択してください。');
      return;
    }

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(file);
    els.placeholderMsg.style.display = 'none';
    els.fileMeta.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;

    if (isVideo) {
      els.imagePreview.style.display = 'none';
      els.videoPreview.style.display = 'block';
      els.videoPreview.src = currentObjectUrl;
      els.videoControls.classList.add('show');
      els.playPauseBtn.textContent = '再生';
    } else {
      els.videoPreview.pause();
      els.videoPreview.style.display = 'none';
      els.videoControls.classList.remove('show');
      els.imagePreview.style.display = 'block';
      els.imagePreview.src = currentObjectUrl;
    }
  }

  // プラットフォーム切替
  document.querySelectorAll('.plat-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.plat-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentPlatform = btn.dataset.platform;
      renderOverlay();
    });
  });

  // 透明度・枠表示
  els.opacitySlider.addEventListener('input', updateOpacity);
  els.showSafeBorder.addEventListener('change', renderOverlay);

  // ファイル選択・ドロップ（サイドバーとプレビュー枠の両方で受付）
  els.dropBox.addEventListener('click', () => els.fileInput.click());
  els.fileInput.addEventListener('change', (e) => loadMediaFile(e.target.files[0]));

  [els.dropBox, els.phoneStage].forEach((zone) => {
    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      loadMediaFile(e.dataTransfer.files[0]);
    });
  });

  // 動画コントロール
  els.playPauseBtn.addEventListener('click', () => {
    if (els.videoPreview.paused) {
      els.videoPreview.play();
    } else {
      els.videoPreview.pause();
    }
  });

  els.videoPreview.addEventListener('play', () => (els.playPauseBtn.textContent = '一時停止'));
  els.videoPreview.addEventListener('pause', () => (els.playPauseBtn.textContent = '再生'));

  els.videoPreview.addEventListener('loadedmetadata', () => {
    els.seekBar.max = els.videoPreview.duration || 0;
    els.seekBar.value = 0;
    els.timeLabel.textContent = `0:00 / ${formatSec(els.videoPreview.duration)}`;
  });

  els.videoPreview.addEventListener('timeupdate', () => {
    els.seekBar.value = els.videoPreview.currentTime;
    els.timeLabel.textContent = `${formatSec(els.videoPreview.currentTime)} / ${formatSec(els.videoPreview.duration)}`;
  });

  els.seekBar.addEventListener('input', () => {
    els.videoPreview.currentTime = Number(els.seekBar.value);
  });

  els.back1sBtn.addEventListener('click', () => {
    els.videoPreview.currentTime = Math.max(0, els.videoPreview.currentTime - 1);
  });

  els.fwd1sBtn.addEventListener('click', () => {
    els.videoPreview.currentTime = Math.min(els.videoPreview.duration || 0, els.videoPreview.currentTime + 1);
  });

  els.muteBtn.addEventListener('click', () => {
    els.videoPreview.muted = !els.videoPreview.muted;
    els.muteBtn.textContent = els.videoPreview.muted ? 'ミュート解除' : 'ミュート';
  });

  // 初期化
  renderOverlay();
  updateOpacity();
</script>
</body>
</html>
